<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thực hành Lắp ghép vectơ - Toán 10</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- KaTeX CSS & JS với Auto-render extension -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y; /* Cho phép lướt cuộn trang trên điện thoại */
    }

    /* Grid pattern chính xác 30px */
    .math-grid {
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(148, 163, 184, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.35) 1px, transparent 1px);
      background-position: 0 0;
    }

    /* Hiệu ứng kéo thả - chỉ chặn cuộn tại chính vật thể này */
    .vector-drag-item {
      cursor: grab;
      touch-action: none;
      transition: transform 0.08s ease, filter 0.15s ease;
    }
    .vector-drag-item:active {
      cursor: grabbing;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.3));
    }

    svg.board-svg {
      touch-action: none; /* Khóa chạm trượt trên bảng vẽ để vẽ mượt */
    }

    /* Hiệu ứng nhấp nháy tâm đích */
    @keyframes pulseTargetRing {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.6); opacity: 0.25; }
    }
    .snap-ring-anim {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseTargetRing 1.4s infinite ease-in-out;
    }

    /* Toast animation */
    .toast-anim {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col overflow-y-auto">

  <!-- ================= TOP HEADER ================= -->
  <header class="bg-white border-b border-slate-200 px-4 py-2.5 shadow-sm shrink-0 z-30 sticky top-0">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shrink-0">
          <i class="fa-solid fa-shapes text-base sm:text-lg"></i>
        </div>
        <div>
          <h1 class="text-sm sm:text-lg font-bold text-slate-900 leading-tight">
            Lắp Ghép Vectơ: Giao Hoán
          </h1>
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium">Toán 10 &bull; Dựng hình và kiểm chứng tổng hai vectơ</p>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="flex items-center gap-2">
        <button id="btnOpenCompare" disabled
          class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold flex items-center gap-1.5 transition-all bg-slate-200 text-slate-400 cursor-not-allowed shadow-none">
          <i class="fa-solid fa-layer-group"></i>
          <span class="hidden sm:inline">So sánh</span> $\overrightarrow{OB} \equiv \overrightarrow{OB'}$
        </button>
        <button id="btnResetAll"
          class="px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 transition flex items-center gap-1">
          <i class="fa-solid fa-rotate-left"></i>
          <span class="hidden sm:inline">Làm lại</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Problem summary banner -->
  <div class="bg-slate-900 text-slate-200 px-4 py-2 shrink-0 border-b border-slate-800 text-xs sm:text-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="px-2 py-0.5 rounded text-[10px] sm:text-[11px] font-bold bg-blue-600 text-white uppercase">Bài toán</span>
        <span class="text-[11px] sm:text-xs">Hai vectơ $\overrightarrow{a}, \overrightarrow{b}$ và điểm $O$ trên lưới:</span>
      </div>
      <div class="flex items-center gap-3 text-[11px] sm:text-xs font-medium">
        <span class="inline-flex items-center gap-1">
          <span class="w-2.5 h-1 bg-blue-500 rounded"></span> $\overrightarrow{a}$ (4 ngang, 1 lên)
        </span>
        <span class="inline-flex items-center gap-1">
          <span class="w-2.5 h-1 bg-amber-500 rounded"></span> $\overrightarrow{b}$ (2 ngang, 3 lên)
        </span>
      </div>
    </div>
  </div>

  <!-- Mobile Tab Switcher (Chỉ hiển thị trên điện thoại) -->
  <div class="md:hidden bg-slate-200 p-1.5 max-w-7xl mx-auto w-full flex gap-1.5 px-3">
    <button id="tabBtnA" onclick="switchMobileTab('panelCaseA')" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white shadow-sm flex items-center justify-center gap-1.5">
      <span>Câu a: $\overrightarrow{a} + \overrightarrow{b}$</span>
    </button>
    <button id="tabBtnB" onclick="switchMobileTab('panelCaseB')" class="flex-1 py-1
